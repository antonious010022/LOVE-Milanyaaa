<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title id="pageTitleTag">رسالة ليكي 💌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%230B1330'/><text x='50' y='58' font-size='55' text-anchor='middle'>✉️</text></svg>">

<style>
/* ============================================================
   ============  1) لوحة الألوان والخطوط (Design Tokens)  ======
   ============================================================ */
:root{
    --ink-deep:#0B1330;      /* خلفية السماء الغامقة */
    --ink-mid:#161f45;
    --ink-warm:#241a3d;      /* تدرج دافئ ناحية الأفق */
    --gold:#E3B873;          /* اللون الذهبي - اللمسة المميزة */
    --gold-soft:rgba(227,184,115,.35);
    --rose:#E2867C;          /* لمسة وردية دافئة، تُستخدم بحرص */
    --paper:#FBF3E7;         /* لون الورق لبطاقة الرسالة */
    --cream:#F5F1E6;         /* نص فاتح على الخلفية الغامقة */
    --line:rgba(227,184,115,.25);
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{
    font-family:'Amiri',serif;
    min-height:100vh;
    background:
        radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,.9), transparent),
        radial-gradient(1px 1px at 75% 15%, rgba(255,255,255,.7), transparent),
        radial-gradient(1.5px 1.5px at 60% 65%, rgba(255,255,255,.8), transparent),
        radial-gradient(1px 1px at 40% 80%, rgba(255,255,255,.6), transparent),
        radial-gradient(1px 1px at 90% 55%, rgba(255,255,255,.7), transparent),
        radial-gradient(1.5px 1.5px at 15% 65%, rgba(255,255,255,.6), transparent),
        linear-gradient(160deg, var(--ink-deep) 0%, var(--ink-mid) 55%, var(--ink-warm) 100%);
    background-size:auto, auto, auto, auto, auto, auto, 100% 100%;
    display:flex;align-items:center;justify-content:center;
    padding:24px;overflow:hidden;position:relative;
}

/* نجوم خافتة تتلألأ في الخلفية */
.twinkle{position:fixed;inset:0;pointer-events:none;z-index:0;contain:strict;}
.star{position:absolute;background:var(--cream);border-radius:50%;animation:twinkle 3.5s ease-in-out infinite;}
@keyframes twinkle{0%,100%{opacity:.15;}50%{opacity:.9;}}

/* خلفية متحركة خفيفة: قلوب وجزيئات ضوئية طايرة */
.bg-fx{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;contain:strict;}
.fx-item{position:absolute;bottom:-10%;will-change:transform,opacity;animation-name:fxFloat;animation-timing-function:linear;animation-iteration-count:infinite;}
.fx-item.heart{color:var(--rose);}
.fx-item.spark{color:var(--gold);}
@keyframes fxFloat{
    0%{transform:translate(0,0) rotate(0deg);opacity:0;}
    8%{opacity:.55;}
    92%{opacity:.4;}
    100%{transform:translate(var(--fx-drift,20px),-115vh) rotate(360deg);opacity:0;}
}

/* ============================================================
   ==================  2) بطاقة الظرف / القفل  =================
   ============================================================ */
.envelope-wrap{position:relative;z-index:2;width:100%;max-width:420px;text-align:center;}

.seal{
    width:74px;height:74px;margin:0 auto 22px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #F0C98A, var(--gold) 60%, #b5813e 100%);
    display:flex;align-items:center;justify-content:center;
    font-size:30px;color:#3a2405;
    box-shadow:0 10px 30px rgba(227,184,115,.35), inset 0 2px 4px rgba(255,255,255,.4);
    animation:sealFloat 4s ease-in-out infinite;
    overflow:hidden;
}
/* لما تتحط صورة بدل إيموجي الظرف: نفس المكان، نفس التوهج، نفس إحساس الـ3D */
.seal.has-photo{
    border:3px solid var(--gold);
    box-shadow:0 10px 30px rgba(227,184,115,.35), inset 0 2px 6px rgba(255,255,255,.35), inset 0 -3px 8px rgba(0,0,0,.35);
}
.seal img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block;}
@keyframes sealFloat{0%,100%{transform:translateY(0) rotate(-3deg);}50%{transform:translateY(-6px) rotate(3deg);}}

.card{
    background:rgba(251,243,231,.06);
    border:1px solid var(--line);
    border-radius:22px;
    padding:38px 28px 32px;
    backdrop-filter:blur(8px);
    box-shadow:0 30px 70px rgba(0,0,0,.45);
    animation:cardIn 1s ease both;
}
@keyframes cardIn{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}

.eyebrow{
    font-family:'Amiri',serif;font-style:italic;font-size:.95em;
    color:var(--gold);letter-spacing:2px;margin-bottom:6px;
}
.title{
    font-family:'Amiri',serif;font-weight:700;
    font-size:clamp(1.6em,6vw,2.1em);color:var(--cream);
    margin-bottom:8px;line-height:1.4;
}
.subtitle{color:rgba(245,241,230,.65);font-size:.92em;margin-bottom:28px;}

.field{position:relative;margin-bottom:16px;}
.field input{
    width:100%;padding:14px 16px;border-radius:14px;
    border:1.5px solid var(--line);background:rgba(255,255,255,.05);
    color:var(--cream);font-family:'Amiri',serif;font-size:1.05em;
    text-align:center;letter-spacing:1px;outline:none;transition:.3s;
}
.field input:focus{border-color:var(--gold);box-shadow:0 0 0 4px var(--gold-soft);background:rgba(255,255,255,.08);}
.field input::placeholder{color:rgba(245,241,230,.4);}

.unlock-btn{
    width:100%;padding:14px;border-radius:14px;border:1px solid var(--gold-soft);
    background:linear-gradient(135deg,#8a5a2c,#3a2a12);
    color:var(--cream);font-weight:700;font-size:1.02em;letter-spacing:.5px;
    cursor:pointer;transition:.35s;font-family:'Amiri',serif;
}
.unlock-btn:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(0,0,0,.5);}
.unlock-btn:active{transform:translateY(0);}

.error{
    display:none;margin-top:14px;padding:10px;border-radius:12px;
    background:rgba(226,134,124,.12);border:1px solid rgba(226,134,124,.35);
    color:#f2b3ab;font-size:.88em;
}

.hint{margin-top:20px;font-family:'Amiri',serif;font-style:italic;color:rgba(227,184,115,.55);font-size:.9em;}
</style>
</head>
<body>

<div class="bg-fx" id="bgFx"></div>
<div class="twinkle" id="twinkle"></div>

<div class="envelope-wrap">
    <div class="seal" id="seal">✉️</div>
    <div class="card">
        <div class="eyebrow">a letter for you</div>
        <h1 class="title" id="titleText">في انتظارك يا حبيبتي</h1>
        <p class="subtitle" id="subtitleText">فيه رسالة مكتوبة ليكي بس محتاجة الكلمة السحرية 🔑</p>

        <div class="field">
            <input type="password" id="password" placeholder="" autocomplete="off">
        </div>
        <button class="unlock-btn" id="unlockBtn"></button>
        <div class="error" id="errorMsg"></div>

        <p class="hint" id="hintText"></p>
    </div>
</div>

<script src="config.js"></script>
<script>
/* ============================================================
   كل النصوص والإعدادات بقت في ملف واحد: config.js
   (LOCK_CONFIG لصفحة القفل دي، و BG_CONFIG للخلفية المتحركة)
   ============================================================ */

document.getElementById('pageTitleTag').textContent = LOCK_CONFIG.browserTabTitle;
document.title = LOCK_CONFIG.browserTabTitle;
document.getElementById('titleText').textContent = LOCK_CONFIG.pageTitle;
document.getElementById('subtitleText').textContent = LOCK_CONFIG.pageSubtitle;
document.getElementById('hintText').textContent = LOCK_CONFIG.hint;
document.getElementById('password').placeholder = LOCK_CONFIG.passwordPlaceholder;
document.getElementById('unlockBtn').textContent = LOCK_CONFIG.unlockButtonText;
// لو فيه صورة متحطة، الظرف ✉️ بيتحول لصورة بنفس المكان ونفس التوهج ونفس الـ3D
if(LOCK_CONFIG.sealImage){
    const sealEl = document.getElementById('seal');
    sealEl.classList.add('has-photo');
    sealEl.innerHTML = `<img src="${LOCK_CONFIG.sealImage}" alt="">`;
}

/* ============================================================
   ====================   المنطق البرمجي   ===================
   ============================================================ */
const passwordInput = document.getElementById('password');
const unlockBtn = document.getElementById('unlockBtn');
const errorMsg = document.getElementById('errorMsg');
const card = document.querySelector('.card');

function unlock(){
    if(passwordInput.value.trim() === LOCK_CONFIG.password){
        errorMsg.style.display = 'none';
        card.style.transition = 'all .9s cubic-bezier(.6,-.28,.74,.05)';
        card.style.opacity = '0';
        card.style.transform = 'scale(.85) translateY(-10px)';
        setTimeout(() => { window.location.href = LOCK_CONFIG.nextPage; }, 850);
    } else {
        errorMsg.textContent = LOCK_CONFIG.wrongPasswordMsg;
        errorMsg.style.display = 'block';
        passwordInput.value = '';
        passwordInput.focus();
        card.style.transition = 'transform .08s ease';
        card.style.transform = 'translateX(10px)';
        setTimeout(() => card.style.transform = 'translateX(-10px)', 80);
        setTimeout(() => card.style.transform = 'translateX(6px)', 160);
        setTimeout(() => card.style.transform = 'translateX(0)', 240);
    }
}
unlockBtn.addEventListener('click', unlock);
passwordInput.addEventListener('keypress', e => { if(e.key === 'Enter') unlock(); });

// خلفية متحركة خفيفة: قلوب وجزيئات ضوئية طايرة خلف كل العناصر
(function initFloatingBG(){
    const wrap = document.getElementById('bgFx');
    const hearts = BG_CONFIG.heartsEmojis;
    const spark = BG_CONFIG.sparkEmoji;
    const total = BG_CONFIG.lockHeartsCount;
    for(let i=0;i<total;i++){
        const el = document.createElement('div');
        const isHeart = i % 3 !== 0;
        el.className = 'fx-item ' + (isHeart ? 'heart' : 'spark');
        el.textContent = isHeart ? hearts[Math.floor(Math.random()*hearts.length)] : spark;
        const size = (isHeart ? (12 + Math.random()*16) : (8 + Math.random()*8)).toFixed(0);
        el.style.fontSize = size+'px';
        el.style.left = Math.random()*100+'%';
        el.style.setProperty('--fx-drift', (Math.random()*80 - 40)+'px');
        el.style.animationDuration = (14 + Math.random()*14)+'s';
        el.style.animationDelay = (Math.random()*16)+'s';
        wrap.appendChild(el);
    }
})();

// نجوم خلفية خافتة تتلألأ
(function initStars(){
    const wrap = document.getElementById('twinkle');
    for(let i=0;i<BG_CONFIG.lockStarsCount;i++){
        const s = document.createElement('div');
        s.className='star';
        const size = (Math.random()*2 + 1).toFixed(1);
        s.style.width = size+'px';
        s.style.height = size+'px';
        s.style.left = Math.random()*100+'%';
        s.style.top = Math.random()*100+'%';
        s.style.animationDelay = (Math.random()*3.5)+'s';
        s.style.animationDuration = (2.5 + Math.random()*3)+'s';
        wrap.appendChild(s);
    }
})();

// إعادة الحالة الأصلية لو المستخدم رجع بزرار الباك
window.addEventListener('pageshow', (e) => {
    if(e.persisted){
        card.style.transition = 'none';
        card.style.opacity = '1';
        card.style.transform = 'none';
        passwordInput.value = '';
        errorMsg.style.display = 'none';
    }
});
</script>
</body>
</html>
