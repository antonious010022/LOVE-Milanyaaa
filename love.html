<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title id="pageTitleTag">رسالتنا 💌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%230B1330'/><text x='50' y='58' font-size='55' text-anchor='middle'>✨</text></svg>">

<style>
/* ============================================================
   1) لوحة الألوان والخطوط — نفس هوية صفحة القفل
   ============================================================ */
:root{
    --ink-deep:#0B1330;
    --ink-mid:#161f45;
    --ink-warm:#241a3d;
    --gold:#E3B873;
    --gold-soft:rgba(227,184,115,.35);
    --gold-dim:rgba(227,184,115,.15);
    --rose:#E2867C;
    --paper:#FBF3E7;
    --paper-2:#F3E7D3;
    --cream:#F5F1E6;
    --ink-text:#2b2418;
    --line:rgba(227,184,115,.25);
    --max-w:640px;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
    font-family:'Amiri',serif;
    background:linear-gradient(180deg, var(--ink-deep) 0%, var(--ink-mid) 45%, var(--ink-warm) 100%);
    color:var(--cream);
    overflow-x:hidden;
    padding-bottom:120px;
}

/* نجوم ثابتة في الخلفية طول الصفحة */
.stars-bg{position:fixed;inset:0;pointer-events:none;z-index:0;contain:strict;}
.stars-bg .star{position:absolute;background:var(--cream);border-radius:50%;animation:twinkle 4s ease-in-out infinite;}
@keyframes twinkle{0%,100%{opacity:.12;}50%{opacity:.85;}}

/* خلفية متحركة خفيفة: قلوب وجزيئات ضوئية طايرة خلف كل العناصر */
.bg-fx{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;contain:strict;}
.fx-item{position:absolute;bottom:-10%;will-change:transform,opacity;animation-name:fxFloat;animation-timing-function:linear;animation-iteration-count:infinite;}
.fx-item.heart{color:var(--rose);}
.fx-item.spark{color:var(--gold);}
@keyframes fxFloat{
    0%{transform:translate(0,0) rotate(0deg);opacity:0;}
    8%{opacity:.5;}
    92%{opacity:.35;}
    100%{transform:translate(var(--fx-drift,20px),-115vh) rotate(360deg);opacity:0;}
}

/* طبقة خلفية: "بحبك" بكل لغات العالم، منتشرة بشكل عشوائي وخافت جدًا */
.bg-loveyou{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden;contain:strict;}
.loveyou-word{
    position:absolute;color:var(--gold);opacity:.09;white-space:nowrap;
    font-family:'Amiri',serif;font-style:italic;font-weight:600;
    animation-name:loveDrift;animation-timing-function:ease-in-out;animation-iteration-count:infinite;
}
@keyframes loveDrift{
    0%,100%{transform:translateY(0) rotate(var(--lw-rot,0deg));opacity:.06;}
    50%{transform:translateY(-14px) rotate(var(--lw-rot,0deg));opacity:.14;}
}

section{position:relative;z-index:2;max-width:var(--max-w);margin:0 auto;padding:70px 22px;}
/* رفع العدّاد فوق الصور وكل عناصر الخلفية بطبقة علوية واضحة */
#countdownSection{z-index:9;}
.countdown-card{position:relative;z-index:9;}

/* ============================================================
   2) الافتتاحية (Hero)
   ============================================================ */
.hero{min-height:92vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 22px;}
.hero-star{
    width:56px;height:56px;border-radius:50%;margin-bottom:22px;
    background:radial-gradient(circle at 35% 30%, #F6DBAA, var(--gold) 65%, #90632f);
    box-shadow:0 0 40px var(--gold-soft);
    animation:floaty 4.5s ease-in-out infinite;
    overflow:hidden;display:flex;align-items:center;justify-content:center;
}
/* لما تتحط صورة بدل الكورة الذهبية العادية: نفس التوهج ونفس الإحساس الـ3D حواليها */
.hero-star.has-photo{
    width:78px;height:78px;
    border:3px solid var(--gold);
    box-shadow:0 0 40px var(--gold-soft), inset 0 2px 6px rgba(255,255,255,.35), inset 0 -3px 8px rgba(0,0,0,.35);
}
.hero-star img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block;}
@keyframes floaty{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}
.hero-eyebrow{font-family:'Amiri',serif;font-style:italic;color:var(--gold);letter-spacing:3px;margin-bottom:10px;font-size:1em;}
.hero-title{
    font-family:'Amiri',serif;font-weight:700;
    font-size:clamp(2em,8vw,3.1em);line-height:1.35;
    color:var(--cream);margin-bottom:20px;
    text-shadow:0 4px 30px rgba(227,184,115,.25);
}
.hero-text{
    max-width:480px;color:rgba(245,241,230,.8);
    font-size:clamp(1em,3.5vw,1.15em);line-height:2.1;
    min-height:180px;text-align:right;
}
.tw-cursor{display:inline-block;width:2px;height:1em;background:var(--gold);margin-inline-start:2px;animation:blink .8s infinite;vertical-align:middle;}
@keyframes blink{0%,49%{opacity:1;}50%,100%{opacity:0;}}


.scroll-cue{
    margin-top:34px;color:var(--gold);font-size:1.5em;opacity:0;
    animation:cueIn .8s ease forwards .3s, bob 1.8s ease-in-out infinite 1s;
    cursor:pointer;
}
@keyframes cueIn{to{opacity:.85;}}
@keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(8px);}}

/* ============================================================
   3) العنوان القياسي لكل قسم
   ============================================================ */
.section-head{text-align:center;margin-bottom:44px;}
.section-eyebrow{font-family:'Amiri',serif;font-style:italic;color:var(--gold);letter-spacing:2px;font-size:.95em;margin-bottom:6px;}
.section-title{font-family:'Amiri',serif;font-weight:700;font-size:clamp(1.6em,6vw,2.2em);color:var(--cream);}

/* ============================================================
   4) القسم المميز: الخط الزمني / الكوكبة (Signature Element)
   ============================================================ */
.timeline{position:relative;padding-inline-start:34px;}
.timeline::before{
    content:'';position:absolute;top:6px;bottom:6px;
    inset-inline-start:9px;width:2px;
    background:linear-gradient(180deg, transparent, var(--gold) 12%, var(--gold) 88%, transparent);
    background-size:100% 220%;
    animation:lineShimmer 5s linear infinite;
    opacity:.55;
}
@keyframes lineShimmer{0%{background-position:0 0;}100%{background-position:0 220%;}}

.tl-item{position:relative;margin-bottom:44px;opacity:0;transform:translateY(24px);transition:all .7s ease;}
.tl-item.in-view{opacity:1;transform:translateY(0);}
.tl-item:last-child{margin-bottom:0;}

.tl-node{
    position:absolute;inset-inline-start:-34px;top:4px;
    width:20px;height:20px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #F6DBAA, var(--gold) 70%);
    box-shadow:0 0 0 4px rgba(227,184,115,.12);
    transition:box-shadow .5s ease;
}
.tl-item.in-view .tl-node{box-shadow:0 0 0 6px rgba(227,184,115,.22), 0 0 18px var(--gold-soft);}

.tl-card{
    background:rgba(255,255,255,.04);border:1px solid var(--line);
    border-radius:18px;overflow:hidden;
    box-shadow:0 14px 34px rgba(0,0,0,.3);
}
.tl-photo{
    width:100%;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg, rgba(227,184,115,.18), rgba(226,134,124,.12));
    color:var(--gold);font-size:2em;overflow:hidden;cursor:pointer;position:relative;
    min-height:80px;
}
.tl-photo.no-img{aspect-ratio:4/3;}
.tl-photo img{width:100%;height:auto;max-height:560px;object-fit:contain;display:block;transition:transform .6s ease;}
.tl-card:hover .tl-photo img{transform:scale(1.02);}
.tl-photo::after{
    content:'\f004';font-family:'Font Awesome 6 Free';font-weight:900;
    position:absolute;bottom:8px;left:10px;font-size:.4em;color:var(--cream);
    background:rgba(11,19,48,.55);width:26px;height:26px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;opacity:.85;
    animation:tapPulse 2.2s ease-in-out infinite;z-index:1;
}
@keyframes tapPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.15);}}

/* تفاعل القلوب اللي بتظهر عشوائي وتتلاشي زي الانستجرام لما تدوسي على أي صورة */
.heart-burst{
    position:absolute;pointer-events:none;z-index:2;
    animation-name:heartBurst;animation-timing-function:ease-out;animation-fill-mode:forwards;
}
@keyframes heartBurst{
    0%{transform:translate(-50%,-50%) scale(.3) rotate(var(--hb-rot,0deg));opacity:0;}
    15%{opacity:1;transform:translate(-50%,-50%) scale(1.15) rotate(var(--hb-rot,0deg));}
    100%{transform:translate(calc(-50% + var(--hb-x,0px)), calc(-50% - 80px)) scale(.9) rotate(var(--hb-rot,0deg));opacity:0;}
}

/* رسالة نصية عشوائية بنفس ستايل/حركة القلوب لما تدوسي على الصورة */
.text-burst{
    position:absolute;pointer-events:none;z-index:3;
    color:var(--cream);font-weight:700;font-size:.95em;white-space:nowrap;
    background:rgba(11,19,48,.72);border:1px solid var(--gold-soft);
    padding:6px 14px;border-radius:999px;box-shadow:0 6px 18px rgba(0,0,0,.35);
    animation-name:heartBurst;animation-timing-function:ease-out;animation-fill-mode:forwards;
}

/* ============================================================
   4-ج) قسم الأحداث المقفولة بالتاريخ
   ============================================================ */
.events-grid{display:flex;flex-direction:column;gap:18px;}
.event-card{
    background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:20px;
    padding:26px 22px;text-align:center;position:relative;overflow:hidden;
    transition:box-shadow .6s ease, border-color .6s ease, filter .6s ease;
}
.event-card.locked{filter:grayscale(.35) brightness(.92);}
.event-icon{font-size:1.7em;color:var(--gold);margin-bottom:10px;transition:transform .5s ease;}
.event-icon.emoji-icon, .event-icon .emoji-icon{filter:sepia(.4) saturate(2) hue-rotate(-10deg);}
.event-card.unlocked .event-icon{animation:heartPop .7s ease;}
.event-title{font-family:'Amiri',serif;font-weight:700;font-size:1.2em;color:var(--cream);margin-bottom:6px;}
.event-date{font-size:.78em;color:rgba(245,241,230,.55);margin-bottom:10px;font-family:'Amiri',serif;font-style:italic;letter-spacing:.5px;}
/* عداد بسيط وصغير للوقت المتبقي لكل حدث */
.event-countdown{
    display:inline-flex;align-items:center;justify-content:center;gap:5px;
    margin:6px 0 2px;padding:5px 12px;border-radius:20px;
    background:var(--gold-dim);border:1px solid var(--line);
    font-size:.8em;color:var(--gold);letter-spacing:.3px;
}
.event-countdown b{font-weight:700;}
.event-countdown .ecd-sep{opacity:.45;margin:0 1px;}
.event-card.unlocked .event-countdown{display:none;}
.event-content{display:none;color:var(--cream);line-height:1.9;font-size:.98em;}
.event-card.unlocked{border-color:var(--gold-soft);box-shadow:0 0 30px rgba(227,184,115,.22);}

/* زرار "افتحي الهدية" اللي بيظهر بعد ما الحدث يتفتح */
.event-open-btn{
    display:none;align-items:center;justify-content:center;gap:8px;margin:14px auto 0;
    padding:10px 24px;border-radius:40px;border:1px solid var(--gold-soft);
    background:linear-gradient(135deg,#8a5a2c,#3a2a12);color:var(--cream);
    font-weight:700;font-size:.95em;cursor:pointer;font-family:'Amiri',serif;
    transition:.35s;
}
.event-card.unlocked .event-open-btn{display:inline-flex;}
.event-open-btn:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(0,0,0,.45);}
.event-open-btn:active{transform:translateY(0);}
.event-open-btn .emoji-icon{font-size:1.15em;}

/* ============================================================
   4-د) نافذة الحدث (مودال) — بردية قديمة متهالكة
   فيها صور كتير بتتسحب رأسي + سكرول كامل للنافذة + أغنية تلقائي
   ============================================================ */
.event-modal{
    display:none;position:fixed;inset:0;z-index:6500;
    background:radial-gradient(circle at 50% 30%, rgba(36,26,61,.97), rgba(11,19,48,.99));
    align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(6px);
}
.event-modal.open{display:flex;animation:fadeScale .4s ease;}

/* بطاقة البردية نفسها: ورق قديم، حواف ممزقة، بقع عمر، ميل بسيط زي لفافة حقيقية */
.event-modal-card{
    max-width:440px;width:100%;max-height:88vh;overflow-y:auto;overflow-x:hidden;
    position:relative;padding:44px 32px 40px;
    transform:rotate(-.4deg);
    color:var(--ink-text);
    background:
        radial-gradient(ellipse 60% 40% at 12% 8%, rgba(139,94,52,.16), transparent 60%),
        radial-gradient(ellipse 50% 35% at 88% 92%, rgba(139,94,52,.18), transparent 60%),
        radial-gradient(ellipse 40% 30% at 70% 20%, rgba(139,94,52,.09), transparent 55%),
        radial-gradient(ellipse 45% 35% at 25% 80%, rgba(139,94,52,.10), transparent 55%),
        repeating-linear-gradient(115deg, rgba(139,94,52,.035) 0px, rgba(139,94,52,.035) 1px, transparent 1px, transparent 3px),
        linear-gradient(160deg, var(--paper) 0%, var(--paper-2) 55%, var(--paper) 100%);
    box-shadow:0 35px 90px rgba(0,0,0,.65), inset 0 0 70px rgba(139,94,52,.22);
    clip-path:polygon(
        0% 2.5%, 3% 0.5%, 7% 1.8%, 11% 0%, 15% 1.4%, 19% 0.3%, 23% 2%, 27% 0.6%,
        31% 1.6%, 35% 0.2%, 39% 2.2%, 43% 0.8%, 47% 1.4%, 51% 0.3%, 55% 2%, 59% 0.6%,
        63% 1.7%, 67% 0.2%, 71% 2.1%, 75% 0.7%, 79% 1.5%, 83% 0.3%, 87% 2%, 91% 0.6%,
        95% 1.6%, 100% 0.5%,
        100% 97.5%, 97% 99.4%, 93% 98.2%, 89% 100%, 85% 98.6%, 81% 99.7%, 77% 98%, 73% 99.4%,
        69% 98.4%, 65% 99.8%, 61% 97.8%, 57% 99.2%, 53% 98.6%, 49% 99.7%, 45% 98%, 41% 99.4%,
        37% 97.8%, 33% 99.8%, 29% 98.3%, 25% 99.7%, 21% 97.9%, 17% 99.4%, 13% 98%, 9% 99.8%,
        5% 97.9%, 0% 99.5%
    );
}
/* شرخ/تجعيد خفيف زي الورق القديم اللي اتلف من فوق تحت */
.event-modal-card::before{
    content:'';position:absolute;inset:0;pointer-events:none;
    background:
        linear-gradient(90deg, rgba(43,36,24,.10) 0%, transparent 3%, transparent 97%, rgba(43,36,24,.10) 100%),
        linear-gradient(180deg, rgba(43,36,24,.10) 0%, transparent 4%, transparent 96%, rgba(43,36,24,.10) 100%);
}

.event-modal-close{
    position:absolute;top:16px;left:16px;width:32px;height:32px;border-radius:50%;
    background:rgba(43,36,24,.75);border:1px solid rgba(43,36,24,.4);color:var(--paper);
    cursor:pointer;font-size:17px;line-height:1;display:flex;align-items:center;justify-content:center;z-index:3;
}

/* جاليري رأسي — تحطي كام صورة عايزة، وهتترص فوق بعض وتتسحب مع سكرول البطاقة كله */
.event-modal-gallery{display:flex;flex-direction:column;gap:20px;margin-bottom:24px;position:relative;z-index:1;}
.event-modal-gallery img{
    width:100%;height:auto;display:block;border-radius:2px;
    background:#00000010;
    box-shadow:0 10px 24px rgba(43,36,24,.4), 0 0 0 1px rgba(43,36,24,.08);
    filter:sepia(.18) contrast(1.03) saturate(.92);
}
.event-photo:nth-child(odd){transform:rotate(-1.1deg);}
.event-photo:nth-child(even){transform:rotate(1deg);}
.event-photo-caption{
    margin-top:8px;text-align:center;font-family:'Amiri',serif;font-style:italic;
    color:#5c3d1c;font-size:.92em;line-height:1.7;padding:0 6px;
}

.event-modal-icon{font-size:1.5em;color:#8a5a2c;text-align:center;margin-bottom:8px;position:relative;z-index:1;}
.event-modal-title{
    font-family:'Amiri',serif;font-weight:700;font-size:1.4em;color:#5c3d1c;
    text-align:center;margin-bottom:18px;position:relative;z-index:1;
}
.event-modal-text{
    color:var(--ink-text);line-height:2.1;font-size:1.02em;white-space:pre-line;
    position:relative;z-index:1;
}
.event-modal-note{
    text-align:center;margin-top:24px;color:#8a5a2c;font-size:.85em;font-style:italic;
    display:flex;align-items:center;justify-content:center;gap:7px;position:relative;z-index:1;
}
.event-modal-note .disc-mini{width:13px;height:13px;border-radius:50%;background:#8a5a2c;animation:spin 3s linear infinite;}
@keyframes spin{from{transform:rotate(0);}to{transform:rotate(360deg);}}
.tl-body{padding:14px 16px 16px;}
.tl-date{font-size:.75em;color:var(--gold);letter-spacing:1px;margin-bottom:4px;font-family:'Amiri',serif;font-style:italic;}
.tl-caption{color:var(--cream);font-size:.98em;line-height:1.7;}

/* ============================================================
   5) قسم العدّاد + الذكرى السنوية
   ============================================================ */
.countdown-card{
    background:rgba(255,255,255,.045);border:1px solid var(--line);border-radius:24px;
    padding:36px 26px;text-align:center;backdrop-filter:blur(6px);
}
.countdown-note{color:rgba(245,241,230,.85);font-size:1em;line-height:2;margin-bottom:24px;}
.countdown-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
.cbox{background:var(--gold-dim);border:1px solid var(--line);border-radius:14px;padding:16px 4px;}
.cbox b{display:block;font-size:clamp(1.5em,6vw,2.1em);color:var(--gold);font-weight:700;line-height:1;margin-bottom:4px;}
.cbox span{font-size:.7em;color:rgba(245,241,230,.7);}
.anniv-badge{
    display:none;margin-top:20px;padding:9px 20px;border-radius:30px;
    background:linear-gradient(135deg, rgba(227,184,115,.25), rgba(226,134,124,.15));
    border:1px solid var(--gold-soft);color:var(--cream);font-weight:700;font-size:.92em;
}
.anniv-badge.show{display:inline-block;animation:badgePulse 2.5s ease-in-out infinite alternate;}
@keyframes badgePulse{0%{box-shadow:0 0 6px var(--gold-soft);}100%{box-shadow:0 0 22px var(--gold-soft);}}

/* حفلة الذكرى - شاشة كاملة */
.anniv-overlay{
    display:none;position:fixed;inset:0;z-index:5000;
    background:radial-gradient(circle at 50% 35%, rgba(36,26,61,.96), rgba(11,19,48,.98));
    align-items:center;justify-content:center;padding:24px;backdrop-filter:blur(6px);
}
.anniv-overlay.open{display:flex;animation:fadeScale .4s ease;}
@keyframes fadeScale{from{opacity:0;transform:scale(.94);}to{opacity:1;transform:scale(1);}}
.anniv-card{max-width:420px;text-align:center;padding:42px 28px;border:1px solid var(--gold-soft);border-radius:26px;background:rgba(255,255,255,.05);}
.anniv-card h2{font-family:'Amiri',serif;font-size:clamp(1.6em,6vw,2.2em);color:var(--gold);margin-bottom:16px;}
.anniv-card p{color:var(--cream);line-height:2;margin-bottom:24px;font-size:1.02em;}
.anniv-close{padding:12px 30px;border-radius:40px;border:1px solid var(--gold-soft);background:linear-gradient(135deg,#8a5a2c,#3a2a12);color:var(--cream);font-weight:700;cursor:pointer;font-family:'Amiri',serif;}
.confetti-piece{position:fixed;top:-30px;font-size:20px;pointer-events:none;z-index:5001;animation:confettiFall linear forwards;}
@keyframes confettiFall{0%{transform:translateY(0) rotate(0);opacity:1;}100%{transform:translateY(110vh) rotate(360deg);opacity:.15;}}

/* ============================================================
   6) قسم الرسالة — بشكل محادثة/تيكست حقيقي (مش ورقة)
   ============================================================ */
.letter{
    background:linear-gradient(165deg, rgba(255,255,255,.045), rgba(255,255,255,.015));
    border:1px solid var(--line);
    border-radius:28px;
    padding:22px 14px 28px;
    box-shadow:0 25px 60px rgba(0,0,0,.4);
    position:relative;
}
/* هيدر المحادثة: زي بروفايل اللي باعتلها الرسالة */
.chat-header{
    display:flex;align-items:center;gap:12px;
    padding:2px 10px 16px;margin-bottom:14px;
    border-bottom:1px solid rgba(227,184,115,.16);
}
.chat-avatar{
    width:46px;height:46px;min-width:46px;border-radius:50%;overflow:hidden;
    background:radial-gradient(circle at 35% 30%, #F6DBAA, var(--gold) 70%);
    display:flex;align-items:center;justify-content:center;font-size:1.3em;color:#3a2405;
}
.chat-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block;}
.chat-header-text{display:flex;flex-direction:column;gap:3px;min-width:0;}
.letter-title{font-family:'Amiri',serif;font-weight:700;font-size:1.2em;color:var(--gold);}
.letter-eyebrow{font-family:'Amiri',serif;font-style:italic;color:rgba(245,241,230,.5);font-size:.8em;}

/* فقاعات الرسائل نفسها */
#letterMessages{display:flex;flex-direction:column;gap:10px;padding:4px 6px 2px;}
.letter-msg{
    width:fit-content;max-width:82%;
    margin-left:auto;margin-right:2px;
    background:linear-gradient(135deg,#8a5a2c,#4a2f14);
    border:1px solid rgba(227,184,115,.2);
    color:var(--cream);
    padding:11px 16px 8px;border-radius:18px 18px 4px 18px;
    font-size:clamp(.94em,3.4vw,1.02em);line-height:1.9;
    box-shadow:0 8px 18px rgba(0,0,0,.3);
    opacity:0;transform:translateY(14px) scale(.97);
    transition:opacity .55s ease, transform .55s ease;
    position:relative;
}
.letter-msg.in-view{opacity:1;transform:translateY(0) scale(1);}
/* ذيل الفقاعة زي رسائل الموبايل */
.letter-msg::before{
    content:'';position:absolute;bottom:0;right:-6px;width:12px;height:14px;
    background:#4a2f14;
    clip-path:polygon(0 0, 100% 100%, 0 100%);
}
.msg-time{
    display:block;text-align:left;margin-top:4px;
    font-size:.68em;color:rgba(245,241,230,.55);letter-spacing:.3px;
}

/* إشارة "اتقرت" زي تطبيقات المحادثة */
.chat-meta{
    display:flex;align-items:center;justify-content:flex-end;gap:5px;
    margin:10px 8px 0;color:rgba(245,241,230,.45);font-size:.72em;
}
.chat-meta i{color:#7fc4e8;}

.letter-sign{text-align:left;margin-top:22px;padding:0 8px;font-family:'Amiri',serif;font-style:italic;font-size:1.15em;color:#c99b5e;}

/* ============================================================
   7) مشغل الموسيقى الثابت
   ============================================================ */
.player{
    position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:200;
    width:calc(100% - 28px);max-width:520px;
    background:rgba(11,19,48,.92);border:1px solid var(--line);border-radius:20px;
    padding:9px 12px;backdrop-filter:blur(8px);box-shadow:0 12px 30px rgba(0,0,0,.5);
}
.player-row{display:flex;align-items:center;gap:10px;}
.disc{
    width:36px;height:36px;min-width:36px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #F6DBAA, var(--gold) 70%);
    display:flex;align-items:center;justify-content:center;color:#3a2405;font-size:13px;
    position:relative;flex-shrink:0;overflow:hidden;
}
/* لما تتحط صورة بدل قلب الديسك: بتفضل بتلف بنفس الطريقة، مع حلقة ذهبية حواليها */
.disc.has-photo{border:2px solid var(--gold);}
.disc img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block;}
.disc::after{content:'';position:absolute;width:6px;height:6px;border-radius:50%;background:#0B1330;z-index:1;}
.disc.spin{animation:spin 4s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.p-ctrl{display:flex;align-items:center;gap:4px;flex-shrink:0;}
.p-btn{width:26px;height:26px;border-radius:50%;background:rgba(227,184,115,.1);border:1px solid var(--line);color:var(--cream);font-size:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.p-play{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#8a5a2c,#3a2a12);border:1px solid var(--gold-soft);color:var(--cream);font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.p-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;}
.p-top{display:flex;justify-content:space-between;gap:6px;font-size:11px;}
.p-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700;}
.p-num{color:rgba(245,241,230,.5);flex-shrink:0;}
.p-bar{width:100%;height:3px;background:rgba(227,184,115,.15);border-radius:10px;cursor:pointer;}
.p-fill{height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--rose));border-radius:10px;}

/* ============================================================
   8) عام / تجاوب
   ============================================================ */
/* ============================================================
   9) توحيد فونت وألوان النصوص العربي على كل الصفحة
   (زي جملة "من أول يوم")، بنفس الذهبي المستخدم في باقي البيدج.
   ملحوظة: قسم "الرسالة" (الورقة) مستثنى عشان يفضل واضح للقراءة
   على خلفية فاتحة، ومشغل الأغاني مستثنى برضو عشان هو عنصر تحكم صغير.
   ============================================================ */
.hero-eyebrow,.hero-title,.hero-text,
.section-eyebrow,.section-title,
.tl-date,.tl-caption,
.countdown-note,.cbox b,.cbox span,.anniv-badge,
.event-title,.event-date,.event-content,.event-countdown,
.photo-modal-text,
.anniv-card h2,.anniv-card p,.anniv-close{
    font-family:'Amiri',serif;
    color:var(--gold);
}
.hero-text,.tl-caption,.countdown-note,.event-content,.photo-modal-text,.anniv-card p{
    color:rgba(227,184,115,.85);
}

@media (max-width:768px){ .timeline{padding-inline-start:30px;} .tl-node{inset-inline-start:-30px;} }
</style>
</head>
<body>

<div class="bg-fx" id="bgFx"></div>
<div class="bg-loveyou" id="bgLoveyou"></div>
<div class="stars-bg" id="starsBg"></div>

<!-- ===================== HERO ===================== -->
<section class="hero">
    <div class="hero-star" id="heroStar"></div>
    <div class="hero-eyebrow" id="heroEyebrow"></div>
    <h1 class="hero-title" id="heroTitle"></h1>
    <div class="hero-text" id="heroTypewriter"></div>
    <div class="scroll-cue" id="scrollCue"><i class="fa-solid fa-chevron-down"></i></div>
</section>

<!-- ================= COUNTDOWN / ANNIVERSARY ================= -->
<section id="countdownSection">
    <div class="section-head">
        <div class="section-eyebrow" id="cdEyebrow"></div>
        <h2 class="section-title" id="cdTitle"></h2>
    </div>
    <div class="countdown-card">
        <p class="countdown-note" id="cdNote"></p>
        <div class="countdown-grid">
            <div class="cbox"><b id="cdDays">00</b><span id="cdLabelDays"></span></div>
            <div class="cbox"><b id="cdHours">00</b><span id="cdLabelHours"></span></div>
            <div class="cbox"><b id="cdMinutes">00</b><span id="cdLabelMinutes"></span></div>
            <div class="cbox"><b id="cdSeconds">00</b><span id="cdLabelSeconds"></span></div>
        </div>
        <div class="anniv-badge" id="anniversaryBadge"></div>
    </div>
</section>

<!-- ================= TIMELINE / CONSTELLATION ================= -->
<section id="timelineSection">
    <div class="section-head">
        <div class="section-eyebrow" id="tlEyebrow"></div>
        <h2 class="section-title" id="tlTitle"></h2>
    </div>
    <div class="timeline" id="timelineList"></div>
</section>

<!-- ================= EVENTS (LOCKED BY DATE) ================= -->
<section id="eventsSection">
    <div class="section-head" id="evHead">
        <div class="section-eyebrow" id="evEyebrow"></div>
        <h2 class="section-title" id="evTitle"></h2>
    </div>
    <div class="events-grid" id="eventsList"></div>
</section>

<!-- ================= LETTER ================= -->
<section id="letterSection">
    <div class="letter">
        <div class="chat-header">
            <div class="chat-avatar" id="chatAvatar">🩷</div>
            <div class="chat-header-text">
                <h2 class="letter-title" id="letterTitle"></h2>
                <div class="letter-eyebrow" id="letterEyebrow"></div>
            </div>
        </div>
        <div id="letterMessages"></div>
        <div class="chat-meta"><span>اتقرت</span><i class="fa-solid fa-check-double"></i></div>
        <p class="letter-sign" id="letterSign"></p>
    </div>
</section>

<!-- ================= ANNIVERSARY OVERLAY ================= -->
<div class="anniv-overlay" id="anniversaryOverlay">
    <div class="anniv-card">
        <h2 id="annivOverlayTitle"></h2>
        <p id="annivOverlayText"></p>
        <button class="anniv-close" id="annivCloseBtn"></button>
    </div>
</div>

<!-- ================= EVENT MODAL (نافذة الحدث: صور + نص + أغنية) ================= -->
<div class="event-modal" id="eventModal">
    <div class="event-modal-card">
        <button class="event-modal-close" id="eventModalClose">&times;</button>
        <div class="event-modal-gallery" id="eventModalGallery"></div>
        <div class="event-modal-icon" id="eventModalIcon"></div>
        <div class="event-modal-title" id="eventModalTitle"></div>
        <p class="event-modal-text" id="eventModalText"></p>
        <div class="event-modal-note" id="eventModalNote"></div>
    </div>
</div>

<!-- ================= MUSIC PLAYER ================= -->
<div class="player">
    <div class="player-row">
        <div class="disc" id="disc"><i class="fa-solid fa-heart"></i></div>
        <div class="p-ctrl">
            <button class="p-btn" id="prevBtn"><i class="fa-solid fa-backward"></i></button>
            <button class="p-play" id="playBtn"><i class="fa-solid fa-play"></i></button>
            <button class="p-btn" id="nextBtn"><i class="fa-solid fa-forward"></i></button>
        </div>
        <div class="p-info">
            <div class="p-top"><span class="p-name" id="songName">—</span><span class="p-num" id="songNum">0/0</span></div>
            <div class="p-bar" id="progressBar"><div class="p-fill" id="progressFill"></div></div>
        </div>
    </div>
</div>

<script src="config.js"></script>
<script>
/* ============================================================
   كل النصوص والإعدادات بقت في ملف واحد: config.js
   (LOVE_CONFIG لصفحة الرسالة دي، و BG_CONFIG للخلفية المتحركة)
   ============================================================ */
document.getElementById('pageTitleTag').textContent = LOVE_CONFIG.browserTabTitle;
document.title = LOVE_CONFIG.browserTabTitle;

/* ================================================================
   ===========   من هنا الكود البرمجي — من غير تعديل   ===========
   ================================================================ */

// --- ملء النصوص الثابتة من CONFIG ---
// --- ملء النصوص الثابتة من CONFIG ---
document.getElementById('heroEyebrow').textContent = LOVE_CONFIG.heroEyebrow;
document.getElementById('heroTitle').textContent = LOVE_CONFIG.heroTitle;
// لو فيه صورة متحطة، الكورة الذهبية بتتحول لصورة بنفس التوهج ونفس الـ3D
if(LOVE_CONFIG.heroImage){
    const heroStarEl = document.getElementById('heroStar');
    heroStarEl.classList.add('has-photo');
    heroStarEl.innerHTML = `<img src="${LOVE_CONFIG.heroImage}" alt="">`;
}
document.getElementById('tlEyebrow').textContent = LOVE_CONFIG.timelineEyebrow;
document.getElementById('tlTitle').textContent = LOVE_CONFIG.timelineTitle;
document.getElementById('cdEyebrow').textContent = LOVE_CONFIG.countdownEyebrow;
document.getElementById('cdTitle').textContent = LOVE_CONFIG.countdownTitle;
document.getElementById('cdNote').textContent = LOVE_CONFIG.countdownNote;
document.getElementById('anniversaryBadge').textContent = LOVE_CONFIG.anniversaryBadgeText;
document.getElementById('letterEyebrow').textContent = LOVE_CONFIG.letterEyebrow;
document.getElementById('letterTitle').textContent = LOVE_CONFIG.letterTitle;
document.getElementById('letterSign').textContent = LOVE_CONFIG.letterSign;
// لو فيه صورة متحطة، أفاتار المحادثة بيتحول لصورتكوا بدل الإيموجي
if(LOVE_CONFIG.letterAvatarImage){
    document.getElementById('chatAvatar').innerHTML = `<img src="${LOVE_CONFIG.letterAvatarImage}" alt="">`;
}
document.getElementById('annivOverlayTitle').textContent = LOVE_CONFIG.anniversaryOverlayTitle;
document.getElementById('annivOverlayText').textContent = LOVE_CONFIG.anniversaryOverlayText;
document.getElementById('annivCloseBtn').textContent = LOVE_CONFIG.anniversaryCloseText;
document.getElementById('evEyebrow').textContent = LOVE_CONFIG.eventsEyebrow;
document.getElementById('evTitle').textContent = LOVE_CONFIG.eventsTitle;
if(!LOVE_CONFIG.eventsTitle) document.getElementById('evTitle').style.display = 'none';
if(!LOVE_CONFIG.eventsEyebrow) document.getElementById('evEyebrow').style.display = 'none';
document.getElementById('cdLabelDays').textContent = LOVE_CONFIG.countdownLabels.days;
document.getElementById('cdLabelHours').textContent = LOVE_CONFIG.countdownLabels.hours;
document.getElementById('cdLabelMinutes').textContent = LOVE_CONFIG.countdownLabels.minutes;
document.getElementById('cdLabelSeconds').textContent = LOVE_CONFIG.countdownLabels.seconds;

// --- بناء الخط الزمني ---
const timelineList = document.getElementById('timelineList');
LOVE_CONFIG.timeline.forEach((item, idx) => {
    const el = document.createElement('div');
    el.className = 'tl-item';
    el.innerHTML = `
        <div class="tl-node"></div>
        <div class="tl-card">
            <div class="tl-photo ${item.img ? '' : 'no-img'}" data-idx="${idx}">${item.img ? `<img src="${item.img}" alt="ذكرى">` : '<i class="fa-solid fa-star"></i>'}</div>
            <div class="tl-body">
                ${item.date ? `<div class="tl-date">${item.date}</div>` : ''}
                <div class="tl-caption">${item.caption}</div>
            </div>
        </div>`;
    timelineList.appendChild(el);
});

// --- الصور التفاعلية: الضغط على أي صورة يطلع قلوب عشوائية بتتلاشي زي الانستجرام + رسالة عشوائية بنفس الستايل ---
const burstHearts = ['💗','💕','❤️','💖','🩷','😍'];
const tapMessages = (LOVE_CONFIG.photoTapMessages && LOVE_CONFIG.photoTapMessages.length) ? LOVE_CONFIG.photoTapMessages : [];
function spawnHeartBurst(container, x, y){
    const count = 5 + Math.floor(Math.random()*3); // من 5 لـ7 قلوب
    for(let i=0;i<count;i++){
        const h = document.createElement('span');
        h.className = 'heart-burst';
        h.textContent = burstHearts[Math.floor(Math.random()*burstHearts.length)];
        const size = 18 + Math.random()*22;
        h.style.fontSize = size+'px';
        h.style.left = (x + (Math.random()*60 - 30)) + 'px';
        h.style.top = (y + (Math.random()*30 - 15)) + 'px';
        h.style.setProperty('--hb-x', (Math.random()*70 - 35)+'px');
        h.style.setProperty('--hb-rot', (Math.random()*40 - 20)+'deg');
        h.style.animationDuration = (1.8 + Math.random()*1.2)+'s';
        h.style.animationDelay = (Math.random()*0.15)+'s';
        container.appendChild(h);
        h.addEventListener('animationend', () => h.remove());
        // شبكة أمان لو animationend ملحقتش (مثلاً التبويب مش شغال في الخلفية)
        setTimeout(() => h.remove(), 3200);
    }
}
// رسالة نصية عشوائية واحدة بتطلع وتتلاشي بنفس حركة القلوب بالظبط
function spawnTextBurst(container, x, y){
    if(!tapMessages.length) return;
    const t = document.createElement('span');
    t.className = 'text-burst';
    t.textContent = tapMessages[Math.floor(Math.random()*tapMessages.length)];
    t.style.left = x + 'px';
    t.style.top = (y - 26) + 'px';
    t.style.setProperty('--hb-x', (Math.random()*40 - 20)+'px');
    t.style.setProperty('--hb-rot', (Math.random()*10 - 5)+'deg');
    t.style.animationDuration = '2.1s';
    container.appendChild(t);
    t.addEventListener('animationend', () => t.remove());
    setTimeout(() => t.remove(), 3200);
}
document.querySelectorAll('.tl-photo').forEach(photo => {
    let tapCount = 0, tapTimer = null;
    photo.addEventListener('click', (e) => {
        const rect = photo.getBoundingClientRect();
        const x = (e.clientX ?? (rect.left + rect.width/2)) - rect.left;
        const y = (e.clientY ?? (rect.top + rect.height/2)) - rect.top;

        // تفاعل القلوب العشوائي اللي بيتلاشى بعد ثانيتين-تلاتة (بيحصل مع كل دوسة)
        spawnHeartBurst(photo, x, y);

        // بعد الدوسة التانية أو التالتة (زي الدبل تاب في الانستجرام) تطلع رسالة عشوائية
        tapCount++;
        clearTimeout(tapTimer);
        if(tapCount >= 2){
            spawnTextBurst(photo, x, y);
            tapCount = 0;
        }
        tapTimer = setTimeout(() => { tapCount = 0; }, 700);
    });
});

// --- بناء رسائل صفحة الرسالة ---
const letterMessagesEl = document.getElementById('letterMessages');
// وقت تقريبي بيزيد شوية مع كل رسالة، عشان يحس كإنه تراسل حقيقي بيتبعت رسالة ورا التانية
let msgHour = 9, msgMinute = 41;
function nextMsgTime(){
    msgMinute += Math.floor(Math.random()*4) + 1;
    if(msgMinute >= 60){ msgMinute -= 60; msgHour = (msgHour % 12) + 1; }
    const period = msgHour < 12 ? 'ص' : 'م';
    const h = ((msgHour - 1) % 12) + 1;
    return `${h}:${String(msgMinute).padStart(2,'0')} ${period}`;
}
LOVE_CONFIG.letterMessages.forEach(msg => {
    const p = document.createElement('p');
    p.className = 'letter-msg';
    p.textContent = msg;
    const time = document.createElement('span');
    time.className = 'msg-time';
    time.textContent = nextMsgTime();
    p.appendChild(time);
    letterMessagesEl.appendChild(p);
});

// --- تأثير الآلة الكاتبة في الافتتاحية ---
(function typewriter(){
    const el = document.getElementById('heroTypewriter');
    const text = LOVE_CONFIG.heroTypewriter;
    let i = 0;
    function step(){
        if(i <= text.length){
            el.innerHTML = text.slice(0, i) + '<span class="tw-cursor"></span>';
            i++;
            setTimeout(step, 45);
        }
    }
    step();
})();

document.getElementById('scrollCue').addEventListener('click', () => {
    document.getElementById('timelineSection').scrollIntoView({behavior:'smooth'});
});

// --- ظهور العناصر عند السكرول (Timeline + Letter) ---
const revealObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => { if(entry.isIntersecting) entry.target.classList.add('in-view'); });
}, {threshold:.25});
document.querySelectorAll('.tl-item, .letter-msg').forEach(el => revealObserver.observe(el));

// --- خلفية متحركة خفيفة: قلوب وجزيئات ضوئية طايرة خلف كل العناصر ---
(function initFloatingBG(){
    const wrap = document.getElementById('bgFx');
    const hearts = BG_CONFIG.heartsEmojis;
    const spark = BG_CONFIG.sparkEmoji;
    const total = BG_CONFIG.loveHeartsCount;
    for(let i=0;i<total;i++){
        const el = document.createElement('div');
        const isHeart = i % 3 !== 0;
        el.className = 'fx-item ' + (isHeart ? 'heart' : 'spark');
        el.textContent = isHeart ? hearts[Math.floor(Math.random()*hearts.length)] : spark;
        const size = isHeart ? (12 + Math.random()*16) : (8 + Math.random()*8);
        el.style.fontSize = size.toFixed(0)+'px';
        el.style.left = Math.random()*100+'%';
        el.style.setProperty('--fx-drift', (Math.random()*80 - 40)+'px');
        el.style.animationDuration = (14 + Math.random()*16)+'s';
        el.style.animationDelay = (Math.random()*18)+'s';
        wrap.appendChild(el);
    }
})();

// --- طبقة خلفية: كلمة "بحبك" بكل اللغات، منتشرة عشوائيًا وخافتة جدًا ---
(function initLoveWords(){
    const wrap = document.getElementById('bgLoveyou');
    const words = BG_CONFIG.loveWords;
    const total = BG_CONFIG.loveWordsCount;
    for(let i=0;i<total;i++){
        const el = document.createElement('div');
        el.className = 'loveyou-word';
        el.textContent = words[i % words.length];
        el.style.top = Math.random()*95+'%';
        el.style.left = Math.random()*90+'%';
        el.style.fontSize = (0.85 + Math.random()*0.9)+'em';
        el.style.setProperty('--lw-rot', (Math.random()*16 - 8)+'deg');
        el.style.animationDuration = (5 + Math.random()*4)+'s';
        el.style.animationDelay = (Math.random()*5)+'s';
        wrap.appendChild(el);
    }
})();

// --- نجوم الخلفية ---
(function initStars(){
    const wrap = document.getElementById('starsBg');
    for(let i=0;i<BG_CONFIG.loveStarsCount;i++){
        const s = document.createElement('div');
        s.className='star';
        const size = (Math.random()*2 + 1).toFixed(1);
        s.style.width = size+'px'; s.style.height = size+'px';
        s.style.left = Math.random()*100+'%'; s.style.top = Math.random()*100+'%';
        s.style.animationDelay = (Math.random()*4)+'s';
        s.style.animationDuration = (3 + Math.random()*3)+'s';
        wrap.appendChild(s);
    }
})();

// --- العدّاد التصاعدي + كشف يوم الذكرى السنوية ---
(function countdown(){
    const start = new Date(LOVE_CONFIG.startDate).getTime();
    const anniv = LOVE_CONFIG.anniversaryDate
        ? new Date(LOVE_CONFIG.anniversaryDate).getTime()
        : new Date(new Date(LOVE_CONFIG.startDate).setFullYear(new Date(LOVE_CONFIG.startDate).getFullYear() + 1)).getTime();
    const annivDayMs = 24*60*60*1000;

    function update(){
        const diff = Date.now() - start;
        if(diff < 0) return;
        const d = Math.floor(diff/86400000);
        const h = Math.floor(diff/3600000 % 24);
        const m = Math.floor(diff/60000 % 60);
        const s = Math.floor(diff/1000 % 60);
        document.getElementById('cdDays').textContent = String(d).padStart(2,'0');
        document.getElementById('cdHours').textContent = String(h).padStart(2,'0');
        document.getElementById('cdMinutes').textContent = String(m).padStart(2,'0');
        document.getElementById('cdSeconds').textContent = String(s).padStart(2,'0');

        const now = Date.now();
        const badge = document.getElementById('anniversaryBadge');
        if(now >= anniv) badge.classList.add('show');
        if(now >= anniv && now < anniv + annivDayMs && !sessionStorage.getItem('annivShown')){
            sessionStorage.setItem('annivShown','1');
            showAnniversary();
        }
    }
    update();
    setInterval(update, 1000);
})();

// --- نظام قفل/فتح الأحداث بالتاريخ ---
// كل حدث فيه تاريخ فتح؛ يفضل مقفول ومعاه عداد بسيط للوقت المتبقي، ويتفتح تلقائيًا (من غير ريفريش)
// بالظبط لما تاريخ ووقت المتصفح يوصل لتاريخ الحدث.
const ARABIC_MONTHS = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
function formatArabicDate(d){
    return `${d.getDate()} ${ARABIC_MONTHS[d.getMonth()]} ${d.getFullYear()}`;
}
// بعد ما الحدث يتفتح، السنة بتتحول لرمز اللانهاية ♾️ (يوم/شهر/♾️) عشان تبقى ذكرى بتتكرر كل سنة للأبد
function formatEternalDate(d){
    return `${d.getDate()}/${d.getMonth()+1}/♾️`;
}
function eventIconHTML(icon){
    // لو الأيقونة بتبدأ بـ "fa-" اعتبرها Font Awesome، غير كده اعتبرها إيموجي مباشر
    if(icon && icon.startsWith('fa-')){
        return `<i class="fa-solid ${icon}"></i>`;
    }
    return `<span class="emoji-icon">${icon || '💛'}</span>`;
}

const eventsList = document.getElementById('eventsList');
const eventsState = {}; // يتتبع أي حدث اتفتح فعلاً عشان منكررش أنيميشن الفتح

// --- نافذة الحدث: صور + نص + أغنية تشتغل تلقائيًا لما تتفتح ---
const eventModal = document.getElementById('eventModal');
const eventModalGallery = document.getElementById('eventModalGallery');
const eventModalIcon = document.getElementById('eventModalIcon');
const eventModalTitle = document.getElementById('eventModalTitle');
const eventModalText = document.getElementById('eventModalText');
const eventModalNote = document.getElementById('eventModalNote');
const eventAudio = new Audio();

function openEventModal(ev){
    // الصور: ترص رأسي كل الصور المتحطة، أي عدد، والنافذة كلها بتتسحب (سكرول) عشان تشوفيهم كلهم
    eventModalGallery.innerHTML = '';
    const images = (ev.images && ev.images.length) ? ev.images.filter(Boolean) : [];
    images.forEach(item => {
        // يدعم الشكلين: نص مباشر "photos/1.jpg" أو object فيه src + caption
        const src = (typeof item === 'string') ? item : item.src;
        const caption = (typeof item === 'object' && item.caption) ? item.caption : '';
        if(!src) return;

        const photoWrap = document.createElement('div');
        photoWrap.className = 'event-photo';

        const img = document.createElement('img');
        img.src = src; img.alt = ev.title; img.loading = 'lazy';
        photoWrap.appendChild(img);

        if(caption){
            const capEl = document.createElement('div');
            capEl.className = 'event-photo-caption';
            capEl.textContent = caption;
            photoWrap.appendChild(capEl);
        }

        eventModalGallery.appendChild(photoWrap);
    });
    eventModalGallery.style.display = images.length ? 'flex' : 'none';

    eventModalIcon.innerHTML = eventIconHTML(ev.icon);
    eventModalTitle.textContent = ev.title;
    eventModalText.textContent = ev.content;

    // وقّفي المشغل الرئيسي وشغّلي أغنية الحدث المخصصة تلقائيًا
    if(window.pauseMainPlayer) window.pauseMainPlayer();
    eventAudio.pause();
    if(ev.song && ev.song.src){
        eventAudio.src = ev.song.src;
        eventAudio.currentTime = 0;
        eventAudio.play().catch(() => {});
        eventModalNote.innerHTML = `<span class="disc-mini"></span> ${ev.song.name || 'أغنية اللحظة دي'}`;
        eventModalNote.style.display = 'flex';
    } else {
        eventModalNote.style.display = 'none';
    }

    eventModal.classList.add('open');
}
function closeEventModal(){
    eventModal.classList.remove('open');
    eventAudio.pause();
}
document.getElementById('eventModalClose').addEventListener('click', closeEventModal);
eventModal.addEventListener('click', (e) => { if(e.target === eventModal) closeEventModal(); });

LOVE_CONFIG.events.forEach(ev => {
    const evDate = new Date(ev.date);
    const card = document.createElement('div');
    card.className = 'event-card locked';
    card.id = 'event-' + ev.id;
    card.innerHTML = `
        <div class="event-icon">${eventIconHTML(ev.icon)}</div>
        <div class="event-title">${ev.title}</div>
        <div class="event-date">${ev.recurringDate ? ev.recurringDate : formatArabicDate(evDate)}</div>
        <div class="event-countdown" id="ecd-${ev.id}">
            <b class="ecd-d">00</b>${LOVE_CONFIG.eventCountdownUnits.days} <span class="ecd-sep">:</span>
            <b class="ecd-h">00</b>${LOVE_CONFIG.eventCountdownUnits.hours} <span class="ecd-sep">:</span>
            <b class="ecd-m">00</b>${LOVE_CONFIG.eventCountdownUnits.minutes} <span class="ecd-sep">:</span>
            <b class="ecd-s">00</b>${LOVE_CONFIG.eventCountdownUnits.seconds}
        </div>
        <button class="event-open-btn" id="event-open-${ev.id}" type="button">
            ${LOVE_CONFIG.eventOpenButtonText || 'افتحي الهدية'}
        </button>`;
    eventsList.appendChild(card);
    document.getElementById('event-open-' + ev.id).addEventListener('click', () => openEventModal(ev));
    eventsState[ev.id] = false;
});

function checkEventsUnlock(){
    const now = Date.now();
    LOVE_CONFIG.events.forEach(ev => {
        const evDate = new Date(ev.date);
        const evTime = evDate.getTime();
        if(now >= evTime){
            if(!eventsState[ev.id]){
                eventsState[ev.id] = true;
                const card = document.getElementById('event-' + ev.id);
                card.classList.remove('locked');
                card.classList.add('unlocked');
                // التاريخ بيتحول تلقائيًا لصيغة أبدية (يوم/شهر/♾️) بعد ما الحدث يتفتح
                const dateEl = card.querySelector('.event-date');
                if(dateEl) dateEl.textContent = ev.recurringDate ? ev.recurringDate : formatEternalDate(evDate);
            }
        } else {
            // لسه مقفول: حدّث العداد الصغير (الوقت المتبقي) كل ثانية
            const remain = evTime - now;
            const d = Math.floor(remain/86400000);
            const h = Math.floor(remain/3600000 % 24);
            const m = Math.floor(remain/60000 % 60);
            const s = Math.floor(remain/1000 % 60);
            const box = document.getElementById('ecd-' + ev.id);
            if(box){
                box.querySelector('.ecd-d').textContent = String(d).padStart(2,'0');
                box.querySelector('.ecd-h').textContent = String(h).padStart(2,'0');
                box.querySelector('.ecd-m').textContent = String(m).padStart(2,'0');
                box.querySelector('.ecd-s').textContent = String(s).padStart(2,'0');
            }
        }
    });
}
checkEventsUnlock();
setInterval(checkEventsUnlock, 1000);

function showAnniversary(){
    document.getElementById('anniversaryOverlay').classList.add('open');
    const icons = ['✨','💫','💖','🎉','⭐','💗'];
    for(let i=0;i<36;i++){
        setTimeout(() => {
            const el = document.createElement('div');
            el.className='confetti-piece';
            el.textContent = icons[Math.floor(Math.random()*icons.length)];
            el.style.left = Math.random()*100+'%';
            el.style.fontSize = (14 + Math.random()*14)+'px';
            el.style.animationDuration = (3+Math.random()*2.5)+'s';
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 6000);
        }, i*80);
    }
}
document.getElementById('annivCloseBtn').addEventListener('click', () => {
    document.getElementById('anniversaryOverlay').classList.remove('open');
});

// --- مشغل الموسيقى ---
(function musicPlayer(){
    const playlist = LOVE_CONFIG.playlist;
    const songNameEl = document.getElementById('songName');
    const songNumEl = document.getElementById('songNum');
    const playBtn = document.getElementById('playBtn');
    const discEl = document.getElementById('disc');
    const fillEl = document.getElementById('progressFill');
    const barEl = document.getElementById('progressBar');
    let idx = 0, playing = false;
    const audio = new Audio();

    // لو فيه صورة متحطة، وسط الديسك بيتحول لصورتكوا وهو بردو بيفضل بيلف زي ما هو
    if(LOVE_CONFIG.discImage){
        discEl.classList.add('has-photo');
        discEl.innerHTML = `<img src="${LOVE_CONFIG.discImage}" alt="">`;
    }

    if(playlist.length === 0){
        songNameEl.textContent = 'أضيفي أغانيك في config.js ✨';
        playBtn.disabled = true;
        playBtn.style.opacity = .4;
        return;
    }

    function load(i){
        idx = i;
        audio.src = playlist[idx].src;
        songNameEl.textContent = playlist[idx].name;
        songNumEl.textContent = `${idx+1}/${playlist.length}`;
        fillEl.style.width = '0%';
    }
    function play(){
        audio.play().then(() => {
            playing = true;
            playBtn.innerHTML = '<i class="fa-solid fa-pause"></i>';
            discEl.classList.add('spin');
        }).catch(()=>{});
    }
    function pause(){
        audio.pause(); playing = false;
        playBtn.innerHTML = '<i class="fa-solid fa-play"></i>';
        discEl.classList.remove('spin');
    }
    function next(){ load((idx+1) % playlist.length); if(playing) play(); }
    function prev(){ load((idx-1+playlist.length) % playlist.length); if(playing) play(); }

    // متاحة برة الـ IIFE عشان نافذة الحدث توقف المشغل الرئيسي وهي بتشغل أغنيتها
    window.pauseMainPlayer = pause;

    playBtn.addEventListener('click', () => playing ? pause() : play());
    document.getElementById('nextBtn').addEventListener('click', next);
    document.getElementById('prevBtn').addEventListener('click', prev);
    audio.addEventListener('timeupdate', () => {
        if(!audio.duration) return;
        fillEl.style.width = (audio.currentTime/audio.duration*100)+'%';
    });
    audio.addEventListener('ended', next);
    barEl.addEventListener('click', (e) => {
        const r = barEl.getBoundingClientRect();
        if(audio.duration) audio.currentTime = ((e.clientX-r.left)/r.width)*audio.duration;
    });

    load(0);

    // --- تشغيل تلقائي فور دخول الصفحة (بعد كتابة الباسورد الصح) ---
    // المتصفحات بتمنع أحيانًا التشغيل التلقائي بصوت من غير تفاعل من المستخدم،
    // فبنجرب نشغّل على طول، ولو اتمنع بنشغّل تلقائيًا مع أول لمسة/ضغطة للمستخدم في الصفحة.
    play();
    const autoStartOnce = () => { if(!playing) play(); };
    document.addEventListener('click', autoStartOnce, { once:true });
    document.addEventListener('touchstart', autoStartOnce, { once:true });
    document.addEventListener('keydown', autoStartOnce, { once:true });
})();
</script>
